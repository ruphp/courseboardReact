# Локальная среда разработки.
# Этот compose-файл нужен только для dev-режима и не является production-конфигурацией.

services:
  courseboardreact_app:
    container_name: courseboardreact_app
    build:
      context: .
      dockerfile: Dockerfile
    image: courseboardreact_app
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - courseboardreact_node_modules:/app/node_modules

volumes:
  courseboardreact_node_modules:
    name: courseboardreact_node_modules
